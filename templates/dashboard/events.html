{% extends 'dashboard/base_dashboard.html' %}

{% block content %}

<h2 class="fw-bold mb-4">

Event Services

</h2>

<div class="row">

{% for event in events %}

<div class="col-md-4 mb-4">

<div class="card border-0 shadow-sm p-3">

{% if event.image %}

<img
src="{{event.image.url}}"
style="height:200px;object-fit:cover"
class="rounded">

{% endif %}

<h5 class="mt-3">

{{event.title}}

</h5>

<p>

{{event.description|truncatewords:15}}

</p>

</div>

</div>

{% endfor %}

</div>

{% endblock %}
