{% extends 'dashboard/base_dashboard.html' %}

{% block content %}

<div class="dashboard-card">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2>

Message Details

</h2>

<a
href="{% url 'messages_management' %}"
class="btn btn-outline-dark">

<i class="fas fa-arrow-left"></i>

Back

</a>

</div>


<div class="row">

<div class="col-md-6 mb-4">

<label class="fw-bold">

Customer Name

</label>

<div class="form-control p-3">

{{message.full_name}}

</div>

</div>


<div class="col-md-6 mb-4">

<label class="fw-bold">

Email

</label>

<div class="form-control p-3">

{{message.email}}

</div>

</div>

</div>



<div class="row">

<div class="col-md-6 mb-4">

<label class="fw-bold">

Subject

</label>

<div class="form-control p-3">

{{message.subject}}

</div>

</div>


<div class="col-md-6 mb-4">

<label class="fw-bold">

Received Date

</label>

<div class="form-control p-3">

{{message.created|date:"d M Y h:i A"}}

</div>

</div>

</div>



<div class="mb-4">

<label class="fw-bold">

Message

</label>

<div
class="form-control p-4"
style="min-height:180px;">

{{message.message}}

</div>

</div>


<div class="mt-4">

<a
href="{% url 'delete_message' message.id %}"
class="btn btn-danger">

Delete Message

</a>

</div>

</div>

{% endblock %}
