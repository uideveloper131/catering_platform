{% extends 'dashboard/base_dashboard.html' %}

{% block content %}

<div class="dashboard-card">

<h2 class="mb-4">

Inquiry Management

</h2>


<form method="GET">

<input
type="text"
name="search"
class="form-control mb-4"
placeholder="Search inquiry">

</form>


<div class="table-responsive">

<table class="table">

<thead>

<tr>

<th>Name</th>
<th>Event</th>
<th>Guests</th>
<th>Status</th>
<th>Actions</th>

</tr>

</thead>

<tbody>

{% for inquiry in inquiries %}

<tr>

<td>

{{inquiry.full_name}}

</td>

<td>

{{inquiry.event_type}}

</td>

<td>

{{inquiry.guests}}

</td>

<td>

<form
method="POST"
action="{% url 'update_inquiry_status' inquiry.id %}">

{% csrf_token %}

<select
name="status"
class="form-select"
onchange="this.form.submit()">

<option
value="New"
{% if inquiry.status == 'New' %}
selected
{% endif %}>

New

</option>

<option
value="In Progress"
{% if inquiry.status == 'In Progress' %}
selected
{% endif %}>

In Progress

</option>

<option
value="Completed"
{% if inquiry.status == 'Completed' %}
selected
{% endif %}>

Completed

</option>

</select>

</form>

</td>

<td>

<a
href="{% url 'delete_inquiry' inquiry.id %}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

{% empty %}

<tr>

<td
colspan="5"
class="text-center">

No inquiries found

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

{% endblock %}
