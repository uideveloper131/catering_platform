{% extends 'dashboard/base_dashboard.html' %}

{% block content %}

<div class="d-flex justify-content-between mb-4">

<h2>

FAQ Management

</h2>

<a
href="{% url 'add_faq' %}"
class="btn btn-warning">

Add FAQ

</a>

</div>


<form method="GET">

<input
type="text"
name="search"
class="form-control mb-4"
placeholder="Search FAQ">

</form>


<div class="card shadow border-0">

<div class="table-responsive">

<table class="table">

<thead>

<tr>

<th>Question</th>
<th>Status</th>
<th>Actions</th>

</tr>

</thead>

<tbody>

{% for faq in faqs %}

<tr>

<td>

{{faq.question}}

</td>

<td>

{% if faq.active %}

<span class="badge bg-success">

Active

</span>

{% else %}

<span class="badge bg-danger">

Inactive

</span>

{% endif %}

</td>

<td>

<a
href="{% url 'edit_faq' faq.id %}"
class="btn btn-primary btn-sm">

Edit

</a>

<a
href="{% url 'delete_faq' faq.id %}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

{% endblock %}
