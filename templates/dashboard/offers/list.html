{% extends 'dashboard/base_dashboard.html' %}

{% block content %}

<div class="d-flex justify-content-between mb-4">

<h2>

Offers Management

</h2>

<a
href="{% url 'add_offer' %}"
class="btn btn-warning">

Add Offer

</a>

</div>


<form method="GET">

<input
type="text"
name="search"
class="form-control mb-4"
placeholder="Search Offer">

</form>


<div class="card shadow border-0">

<div class="table-responsive">

<table class="table">

<thead>

<tr>

<th>Image</th>
<th>Title</th>
<th>Price</th>
<th>Actions</th>

</tr>

</thead>

<tbody>

{% for offer in offers %}

<tr>

<td>

{% if offer.image %}

<img
src="{{offer.image.url}}"
width="70"
height="70"
style="border-radius:10px;object-fit:cover;">

{% endif %}

</td>

<td>{{offer.title}}</td>

<td>{{offer.price}}</td>

<td>

<a
href="{% url 'edit_offer' offer.id %}"
class="btn btn-primary btn-sm">

Edit

</a>

<a
href="{% url 'delete_offer' offer.id %}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

{% endblock %}
