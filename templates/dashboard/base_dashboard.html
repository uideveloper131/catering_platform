<!DOCTYPE html>
<html>

<head>

<title>

Admin Dashboard

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

background:#f4f6f9;

margin:0;

}

.sidebar{

position:fixed;

left:0;

top:0;

width:250px;

height:100vh;

background:#1f2937;

padding:30px;

}

.sidebar h3{

color:white;

margin-bottom:40px;

}

.sidebar a{

display:block;

color:white;

padding:12px;

text-decoration:none;

border-radius:8px;

margin-bottom:10px;

}

.sidebar a:hover{

background:#374151;

}

.content{

margin-left:280px;

padding:40px;

}

</style>

</head>

<body>

<div class="sidebar">

<h3>

Catering Admin

</h3>

<a href="/dashboard/">

Dashboard

</a>

<a href="/dashboard/inquiries/">
Inquiries
</a>

<a href="/admin/brands/brand/">

Brands

</a>

<a href="/admin/menu/menuitem/">

Menu

</a>

<a href="/admin/gallery/">

Gallery

</a>

<a href="/accounts/logout/">

Logout

</a>

</div>


<div class="content">

{% block content %}

{% endblock %}

</div>

</body>

</html>
