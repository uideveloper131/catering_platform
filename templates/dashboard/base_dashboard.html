<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Catering Admin Dashboard

</title>

<!-- =========================
        GOOGLE FONT
========================= -->

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<!-- =========================
        BOOTSTRAP
========================= -->

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- =========================
        FONT AWESOME
========================= -->

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

/* =========================
        ROOT
========================= */

:root{

--primary:#ffc107;
--dark:#111111;
--dark-light:#1f1f1f;
--gray:#6b7280;
--light:#f8fafc;
--white:#ffffff;

}

/* =========================
        GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Poppins',sans-serif;
background:#f4f7fb;
overflow-x:hidden;

}

/* =========================
        SIDEBAR
========================= */

.sidebar{

position:fixed;
top:0;
left:0;

width:290px;
height:100vh;

background:#111111;

padding:28px 22px;

overflow-y:auto;

z-index:999;

border-right:1px solid rgba(255,255,255,.05);

box-shadow:10px 0 40px rgba(0,0,0,.12);

transition:.4s;

}

/* SCROLLBAR */

.sidebar::-webkit-scrollbar{
width:6px;
}

.sidebar::-webkit-scrollbar-thumb{
background:#ffc107;
border-radius:20px;
}

/* =========================
        LOGO
========================= */

.logo-box{

display:flex;
align-items:center;
gap:14px;

margin-bottom:45px;

}

.logo-icon{

width:58px;
height:58px;

background:linear-gradient(
135deg,
#ffc107,
#ffcd39
);

border-radius:18px;

display:flex;
align-items:center;
justify-content:center;

font-size:28px;

color:#111111;

font-weight:700;

box-shadow:0 10px 30px rgba(255,193,7,.25);

}

.logo-text{

display:flex;
flex-direction:column;

}

.logo-title{

color:#ffffff;
font-size:24px;
font-weight:800;
line-height:1.1;

}

.logo-subtitle{

color:#9ca3af;
font-size:12px;
margin-top:4px;

}

/* =========================
        MENU
========================= */

.menu-title{

color:#9ca3af;
font-size:12px;
font-weight:700;
letter-spacing:1px;

margin-bottom:18px;
padding-left:10px;

}

.sidebar a{

display:flex;
align-items:center;
gap:14px;

padding:15px 18px;

margin-bottom:10px;

text-decoration:none;

color:#d1d5db;

font-size:15px;
font-weight:500;

border-radius:18px;

transition:.3s;

}

.sidebar a i{

width:20px;
text-align:center;
font-size:16px;

}

.sidebar a:hover{

background:rgba(255,193,7,.12);
color:#ffc107;

transform:translateX(4px);

}

/* ACTIVE */

.sidebar a.active{

background:#ffc107;
color:#111111;
font-weight:700;

}

/* =========================
        LOGOUT
========================= */

.logout{

margin-top:40px;

background:rgba(255,0,0,.08);

color:#ffb4b4 !important;

}

.logout:hover{

background:#ff4d4d !important;
color:#ffffff !important;

}

/* =========================
        CONTENT
========================= */

.content{

margin-left:290px;
padding:30px;

min-height:100vh;

transition:.4s;

}

/* =========================
        TOPBAR
========================= */

.topbar{

background:#ffffff;

padding:22px 28px;

border-radius:28px;

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:30px;

box-shadow:0 12px 35px rgba(0,0,0,.05);

}

/* TITLE */

.topbar h4{

margin:0;

font-size:28px;
font-weight:800;
color:#111111;

}

/* =========================
        USER
========================= */

.user-box{

display:flex;
align-items:center;
gap:15px;

}

/* AVATAR */

.avatar{

width:52px;
height:52px;

background:linear-gradient(
135deg,
#ffc107,
#ffcd39
);

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:18px;
font-weight:700;

color:#111111;

box-shadow:0 10px 25px rgba(255,193,7,.25);

}

.user-details{

display:flex;
flex-direction:column;

}

.user-name{

font-size:15px;
font-weight:700;
color:#111111;

}

.user-role{

font-size:13px;
color:#6b7280;

}

/* =========================
        MOBILE BUTTON
========================= */

.mobile-btn{

position:fixed;
top:18px;
left:18px;

width:52px;
height:52px;

border:none;

background:#ffc107;

border-radius:16px;

display:none;

align-items:center;
justify-content:center;

font-size:20px;
font-weight:700;

color:#111111;

z-index:1001;

box-shadow:0 10px 30px rgba(255,193,7,.25);

}

/* =========================
        CARDS
========================= */

.dashboard-card{

background:#ffffff;

padding:28px;

border-radius:28px;

box-shadow:0 12px 35px rgba(0,0,0,.05);

border:1px solid #f1f1f1;

}

/* =========================
        MOBILE
========================= */

@media(max-width:991px){

.sidebar{

left:-310px;

}

.sidebar.show{

left:0;

}

.content{

margin-left:0;
padding:90px 20px 20px;

}

.mobile-btn{

display:flex;

}

.topbar{

padding:20px;

border-radius:24px;

}

.topbar h4{

font-size:22px;

}

.logo-title{

font-size:22px;

}

}

/* =========================
        SMALL MOBILE
========================= */

@media(max-width:576px){

.sidebar{

width:280px;

padding:24px 18px;

}

.content{

padding:85px 15px 15px;

}

.topbar{

flex-direction:column;
align-items:flex-start;
gap:20px;

}

.user-box{

width:100%;

}

.topbar h4{

font-size:20px;

}

.mobile-btn{

width:48px;
height:48px;

font-size:18px;

border-radius:14px;

}

.logo-icon{

width:52px;
height:52px;

font-size:24px;

}

.logo-title{

font-size:20px;

}

}

</style>

</head>

<body>

<!-- =========================
        MOBILE BUTTON
========================= -->

<button
class="mobile-btn"
onclick="toggleMenu()">

<i class="fas fa-bars"></i>

</button>


<!-- =========================
        SIDEBAR
========================= -->

<div
class="sidebar"
id="sidebar">

    <!-- LOGO -->

    <div class="logo-box">

        <div class="logo-icon">

            🍽

        </div>

        <div class="logo-text">

            <span class="logo-title">

                Catering Admin

            </span>

            <span class="logo-subtitle">

                Management Dashboard

            </span>

        </div>

    </div>


    <!-- MENU -->

    <div class="menu-title">

        MAIN MENU

    </div>


    <a
    href="/dashboard/"
    class="active">

        <i class="fas fa-chart-line"></i>

        Dashboard

    </a>


    <a href="/dashboard/inquiries/">

        <i class="fas fa-envelope"></i>

        Inquiries

    </a>


    <a href="/dashboard/brands/">

        <i class="fas fa-store"></i>

        Brands

    </a>


    <a href="/dashboard/events/">

        <i class="fas fa-calendar"></i>

        Events

    </a>


    <a href="/dashboard/gallery/">

        <i class="fas fa-images"></i>

        Gallery

    </a>


    <a href="/dashboard/offers/">

        <i class="fas fa-gift"></i>

        Offers

    </a>


    <a href="/dashboard/messages/">

        <i class="fas fa-message"></i>

        Messages

    </a>


    <a
    href="/admin/"
    target="_blank">

        <i class="fas fa-user-shield"></i>

        Django Admin

    </a>


    <!-- LOGOUT -->

    <a
    href="/accounts/logout/"
    class="logout">

        <i class="fas fa-right-from-bracket"></i>

        Logout

    </a>

</div>


<!-- =========================
        CONTENT
========================= -->

<div class="content">

    <!-- TOPBAR -->

    <div class="topbar">

        <h4>

            Admin Dashboard

        </h4>


        <!-- USER -->

        <div class="user-box">

            <div class="avatar">

                {{request.user.username|first|upper}}

            </div>

            <div class="user-details">

                <span class="user-name">

                    {{request.user.username}}

                </span>

                <span class="user-role">

                    Administrator

                </span>

            </div>

        </div>

    </div>


    <!-- PAGE CONTENT -->

    {% block content %}

    {% endblock %}

</div>


<!-- =========================
        JAVASCRIPT
========================= -->

<script>

function toggleMenu(){

document
.getElementById(
'sidebar'
)

.classList.toggle(
'show'
)

}

/* CLOSE SIDEBAR ON MOBILE */

document.addEventListener(

'click',

function(event){

const sidebar =
document.getElementById(
'sidebar'
);

const button =
document.querySelector(
'.mobile-btn'
);

if(

window.innerWidth <= 991 &&

!sidebar.contains(event.target) &&

!button.contains(event.target)

){

sidebar.classList.remove(
'show'
);

}

}

);

</script>

</body>

</html>
