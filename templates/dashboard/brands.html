{% extends 'dashboard/base_dashboard.html' %}

{% block content %}

<h2 class="fw-bold mb-4">

Brands

</h2>

<div class="row">

{% for brand in brands %}

<div class="col-md-4 mb-4">

<div class="card border-0 shadow-sm p-3">

{% if brand.image %}

<img
src="{{brand.image.url}}"
style="height:200px;object-fit:cover"
class="rounded">

{% endif %}

<h5 class="mt-3">

{{brand.name}}

</h5>

<p>

{{brand.description|truncatewords:10}}

</p>

</div>

</div>

{% endfor %}

</div>

{% endblock %}
