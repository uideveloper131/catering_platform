{% extends 'dashboard/base_dashboard.html' %}

{% block content %}

<div class="dashboard-card">

<div class="d-flex justify-content-between mb-4">

<h2>

Menu Management

</h2>

<a
href="{% url 'add_menu' %}"
class="btn btn-warning">

Add Menu Item

</a>

</div>

<form method="GET">

<input
type="text"
name="search"
class="form-control mb-4"
placeholder="Search menu item">

</form>

<table class="table">

<thead>

<tr>

<th>Image</th>
<th>Name</th>
<th>Brand</th>
<th>Actions</th>

</tr>

</thead>

<tbody>

{% for menu in menus %}

<tr>

<td>

{% if menu.image %}
<img
src="{{menu.image.url}}"
width="70"
height="70"
style="border-radius:10px;">
{% endif %}

</td>

<td>{{menu.name}}</td>

<td>{{menu.brand}}</td>

<td>

<a
href="{% url 'edit_menu' menu.id %}"
class="btn btn-primary btn-sm">

Edit

</a>

<a
href="{% url 'delete_menu' menu.id %}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
