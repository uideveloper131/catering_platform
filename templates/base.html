<!DOCTYPE html>

<html>

<head>

{% load static %}

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>

Catering Platform

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<style>
/* BRAND SECTION */

.brand-section{

background:#f8f9fa;

}

.section-title{

font-size:42px;
font-weight:700;
text-align:center;
margin-bottom:10px;

}

.section-subtitle{

text-align:center;
color:#666;
margin-bottom:50px;

}

.brand-link{

text-decoration:none;
color:inherit;

}

.brand-card{

background:#fff;
border-radius:20px;
overflow:hidden;
transition:0.4s;
height:100%;
box-shadow:0 8px 25px rgba(0,0,0,0.08);

}

.brand-card:hover{

transform:translateY(-10px);
box-shadow:0 15px 35px rgba(0,0,0,0.15);

}

.brand-image{

width:100%;
height:240px;
object-fit:cover;

}

.brand-content{

padding:25px;

}

.brand-content h4{

font-size:22px;
font-weight:700;
margin-bottom:15px;

}

.brand-content p{

color:#666;
font-size:15px;
line-height:1.7;

}

.explore-btn{

display:inline-block;
margin-top:15px;
padding:8px 18px;
background:#ffc107;
border-radius:30px;
font-weight:600;
transition:.3s;

}

.brand-card:hover .explore-btn{

background:#212529;
color:white;

}

/* EVENT SERVICES */

.event-card{

background:#fff;
border-radius:20px;
overflow:hidden;
height:100%;
transition:.4s;
box-shadow:0 8px 25px rgba(0,0,0,.08);

}

.event-card:hover{

transform:translateY(-10px);
box-shadow:0 18px 35px rgba(0,0,0,.15);

}

.event-image{

width:100%;
height:250px;
object-fit:cover;

}

.event-content{

padding:25px;

}

.event-content h4{

font-size:22px;
font-weight:700;
margin-bottom:15px;

}

.event-content p{

font-size:15px;
color:#666;
line-height:1.7;
min-height:70px;

}

.event-btn{

display:inline-block;
margin-top:15px;
padding:10px 20px;
background:#ffc107;
border-radius:30px;
font-weight:600;
transition:.3s;

}

.event-card:hover .event-btn{

background:#212529;
color:white;

}
.event-card{

background:white;
border-radius:20px;
overflow:hidden;
height:100%;
transition:.4s;
box-shadow:0 8px 25px rgba(0,0,0,.08);

}

.event-card:hover{

transform:translateY(-10px);
box-shadow:0 18px 35px rgba(0,0,0,.15);

}

.event-image{

width:100%;
height:250px;
object-fit:cover;

}

.event-content{

padding:25px;

}

.event-content h4{

font-size:22px;
font-weight:700;
margin-bottom:15px;

}

.event-content p{

color:#666;
line-height:1.7;
min-height:70px;

}

.event-btn{

display:inline-block;
margin-top:15px;
padding:10px 20px;
background:#ffc107;
border-radius:30px;
font-weight:600;
transition:.3s;

}

.event-card:hover .event-btn{

background:#212529;
color:white;

}

/* TESTIMONIALS */

.testimonial-section{

background:#f5f5f5;

}

.testimonial-wrapper{

display:flex;
gap:30px;
overflow-x:auto;
padding-bottom:20px;
scroll-behavior:smooth;

}

.testimonial-wrapper::-webkit-scrollbar{

height:8px;

}

.testimonial-wrapper::-webkit-scrollbar-thumb{

background:#ffc107;
border-radius:10px;

}

.testimonial-item{

flex:0 0 32%;

}

.testimonial-card{

background:white;
border-radius:30px;
padding:40px;
height:100%;
box-shadow:0 10px 30px rgba(0,0,0,.08);
transition:.4s;

}

.testimonial-card:hover{

transform:translateY(-8px);

}

.stars{

font-size:25px;
margin-bottom:20px;

}

.review-text{

font-size:18px;
line-height:1.9;
color:#444;
min-height:200px;

}

.show-more{

display:inline-block;
margin-bottom:25px;
font-weight:700;
text-decoration:none;
color:black;

}

.customer-info{

display:flex;
align-items:center;
gap:15px;

}

.avatar{

width:70px;
height:70px;
border-radius:50%;
background:#ff4d4d;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:30px;
font-weight:bold;

}

.customer-info h5{

margin:0;
font-size:28px;
font-weight:700;

}

.customer-info small{

color:#666;

}


/* Tablet */

@media(max-width:992px){

.testimonial-item{

flex:0 0 48%;

}

}


/* Mobile */

@media(max-width:768px){

.testimonial-item{

flex:0 0 95%;

}

.review-text{

min-height:auto;

}

}
.testimonial-wrapper{

scrollbar-width:none;

}

.testimonial-wrapper::-webkit-scrollbar{

display:none;

}
/* FAQ SECTION */

.faq-section{

background:#f8f9fa;

}

.faq-subtitle{

color:#ffc107;
font-size:14px;
font-weight:700;
letter-spacing:2px;

}

.faq-heading{

font-size:45px;
font-weight:700;
margin-top:10px;

}

.faq-description{

color:#666;
max-width:700px;
margin:auto;
margin-top:15px;

}

.faq-wrapper{

max-width:900px;
margin:auto;

}

.accordion-item{

border:none;
margin-bottom:20px;
border-radius:15px !important;
overflow:hidden;
box-shadow:0 8px 25px rgba(0,0,0,.06);

}

.accordion-button{

font-size:18px;
font-weight:600;
padding:25px;
background:white;

}

.accordion-button:not(.collapsed){

background:#ffc107;
color:black;
box-shadow:none;

}

.accordion-button:focus{

box-shadow:none;
border:none;

}

.accordion-body{

padding:25px;
color:#666;
line-height:1.8;
background:white;

}
</style>

</head>

<body>

{% include 'components/navbar.html' %}

{% block content %}

{% endblock %}

{% include 'components/footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

</script>

</body>

</html>
