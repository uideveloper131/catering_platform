<!DOCTYPE html>

<html lang="en">

<head>

{% load static %}

<!-- =========================
        SEO META TAGS
========================= -->

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">
<meta
name="language"
content="English">

<meta
name="geo.region"
content="US">

<meta
name="geo.placename"
content="United States">

<meta
http-equiv="X-UA-Compatible"
content="IE=edge">

<title>
{% block title %}
Premium Catering Services | Catering Platform
{% endblock %}
</title>

<meta
name="description"
content="{% block meta_description %}Premium multi-brand catering platform for weddings, corporate events, birthdays, private parties, and luxury dining experiences.{% endblock %}">

<meta
name="keywords"
content="{% block meta_keywords %}catering services,wedding catering,corporate catering,birthday catering,event catering,luxury catering{% endblock %}">

<meta
name="author"
content="Catering Platform">

<meta
name="robots"
content="index,follow">

<meta
name="theme-color"
content="#111111">

<link
rel="canonical"
href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">

<!-- =========================
        OPEN GRAPH SEO
========================= -->

<meta
property="og:type"
content="website">

<meta
property="og:site_name"
content="Catering Platform">

<meta
property="og:title"
content="{% block og_title %}Premium Catering Services | Catering Platform{% endblock %}">

<meta
property="og:description"
content="{% block og_description %}Luxury catering services for weddings, corporate events, birthdays and private celebrations.{% endblock %}">

<meta
property="og:url"
content="{{ request.build_absolute_uri|default:'https://cateringservices.pythonanywhere.com/' }}">

<meta
property="og:image"
content="{% static 'images/seo-banner.jpg' %}">

<!-- =========================
        TWITTER SEO
========================= -->

<meta
name="twitter:card"
content="summary_large_image">

<meta
name="twitter:title"
content="{% block twitter_title %}Premium Catering Services | Catering Platform{% endblock %}">

<meta
name="twitter:description"
content="{% block twitter_description %}Luxury catering services for unforgettable celebrations.{% endblock %}">

<meta
name="twitter:image"
content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/seo-banner.jpg' %}">
<!-- =========================
        SCHEMA MARKUP
========================= -->
{% block schema_markup %}
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"LocalBusiness",
  "name":"Catering Platform",
  "url":"https://cateringservices.pythonanywhere.com",
  "description":"Premium catering services for weddings, birthdays, corporate events and private celebrations.",
  "image":"https://cateringservices.pythonanywhere.com/static/images/seo-banner.jpg",
  "priceRange":"$$",
  "serviceType":"Catering Services"
}
</script>
{% endblock %}

<!-- =========================
        FAVICON
========================= -->

<link
rel="icon"
type="image/png"
href="{% static 'images/favicon.png' %}">



<link
rel="preload"
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
as="style">

<link
rel="apple-touch-icon"
href="{% static 'images/favicon.png' %}">

<!-- =========================
        GOOGLE FONTS
========================= -->

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<meta
property="og:image"
content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/seo-banner.jpg' %}">


<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- =========================
        BOOTSTRAP
========================= -->

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- =========================
        GLOBAL CSS
========================= -->

<style>

/* =========================
        ROOT
========================= */

:root{

--primary:#ffc107;
--dark:#111111;
--dark-light:#1f1f1f;
--gray:#6b7280;
--light:#f8fafc;
--white:#ffffff;

}

/* =========================
        GLOBAL
========================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:'Poppins',sans-serif;
background:#ffffff;
color:#111111;
overflow-x:hidden;
animation:fadeIn .5s ease;

}

/* =========================
        PAGE ANIMATION
========================= */

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* =========================
        SECTION SPACING
========================= */

section{
padding:90px 0;
}

/* =========================
        CONTAINER
========================= */

.container{
max-width:1320px;
}

/* =========================
        HEADINGS
========================= */

h1{
font-size:64px;
font-weight:800;
line-height:1.1;
}

h2{
font-size:48px;
font-weight:800;
line-height:1.2;
}

h3{
font-size:36px;
font-weight:700;
}

h4{
font-size:24px;
font-weight:700;
}

p{
font-size:16px;
line-height:1.9;
color:var(--gray);
margin-bottom:0;
}

/* =========================
        BUTTONS
========================= */

.btn{
border:none;
border-radius:50px;
padding:14px 30px;
font-weight:700;
font-size:15px;
transition:.3s;
}

.btn-warning{
background:linear-gradient(
135deg,
#ffc107,
#ffcd39
);
color:#111111;
box-shadow:0 10px 25px rgba(255,193,7,.22);
}

.btn-warning:hover{
background:linear-gradient(
135deg,
#ffcd39,
#ffc107
);
color:#111111;
transform:translateY(-2px);
}

.btn-dark{
background:#111111;
color:#ffffff;
}

.btn-dark:hover{
background:#1f1f1f;
color:#ffffff;
}

/* =========================
        CARDS
========================= */

.card{

border:none;
border-radius:30px;
overflow:hidden;
box-shadow:0 12px 40px rgba(0,0,0,.06);
transition:.35s;
background:#ffffff;

}

.card:hover{

transform:translateY(-6px);

}

/* =========================
        IMAGES
========================= */

img{
max-width:100%;
display:block;
}

.card img{
object-fit:cover;
}

/* =========================
        SECTION TITLE
========================= */

.section-title{
text-align:center;
margin-bottom:15px;
}

.section-subtitle{
text-align:center;
max-width:720px;
margin:auto;
margin-bottom:60px;
}

/* =========================
        BRAND SECTION
========================= */

.brand-section{
background:#f8fafc;
}

.brand-link{
text-decoration:none;
color:inherit;
}

.brand-card{
background:#ffffff;
border-radius:30px;
overflow:hidden;
height:100%;
border:1px solid #f1f1f1;
box-shadow:0 12px 40px rgba(0,0,0,.06);
transition:.35s;
}

.brand-card:hover{
transform:translateY(-6px);
}

.brand-image{
width:100%;
height:280px;
object-fit:cover;
transition:.4s;
}

.brand-card:hover .brand-image{
transform:scale(1.05);
}

.brand-content{
padding:28px;
}

.brand-content p{
margin-top:15px;
min-height:85px;
}

.explore-btn{
display:inline-block;
margin-top:22px;
padding:13px 22px;
background:#111111;
color:#ffffff;
border-radius:50px;
font-size:14px;
font-weight:600;
transition:.3s;
}

.brand-card:hover .explore-btn{
background:#ffc107;
color:#111111;
}

/* =========================
        EVENT CARDS
========================= */

.event-card{
background:#ffffff;
border-radius:30px;
overflow:hidden;
height:100%;
border:1px solid #f1f1f1;
box-shadow:0 12px 40px rgba(0,0,0,.06);
transition:.35s;
}

.event-card:hover{
transform:translateY(-6px);
}

.event-image{
width:100%;
height:280px;
object-fit:cover;
transition:.4s;
}

.event-card:hover .event-image{
transform:scale(1.05);
}

.event-content{
padding:28px;
}

.event-content p{
margin-top:15px;
min-height:85px;
}

.event-btn{
display:inline-block;
margin-top:22px;
padding:13px 22px;
background:#111111;
color:#ffffff;
border-radius:50px;
font-size:14px;
font-weight:600;
transition:.3s;
}

.event-card:hover .event-btn{
background:#ffc107;
color:#111111;
}

/* =========================
        TESTIMONIALS
========================= */

.testimonial-section{
background:#f8fafc;
}

.testimonial-wrapper{
display:flex;
gap:30px;
overflow-x:auto;
padding-bottom:10px;
scroll-behavior:smooth;
scrollbar-width:none;
}

.testimonial-wrapper::-webkit-scrollbar{
display:none;
}

.testimonial-item{
flex:0 0 32%;
}

.testimonial-card{
background:#ffffff;
border-radius:32px;
padding:40px;
height:100%;
box-shadow:0 12px 40px rgba(0,0,0,.06);
transition:.35s;
}

.testimonial-card:hover{
transform:translateY(-6px);
}

.stars{
font-size:24px;
margin-bottom:20px;
}

.review-text{
font-size:17px;
line-height:1.9;
color:#4b5563;
min-height:180px;
}

.customer-info{
display:flex;
align-items:center;
gap:16px;
margin-top:30px;
}

.avatar{
width:68px;
height:68px;
border-radius:50%;
background:#ffc107;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
font-weight:700;
color:#111111;
}

.customer-info h5{
margin:0;
font-size:22px;
font-weight:700;
}

.customer-info small{
color:#6b7280;
}

/* =========================
        FAQ
========================= */

.faq-section{
background:#ffffff;
}

.faq-subtitle{
color:#ffc107;
font-size:14px;
font-weight:700;
letter-spacing:2px;
margin-bottom:15px;
}

.faq-heading{
font-size:52px;
font-weight:800;
margin-bottom:20px;
}

.faq-description{
max-width:720px;
margin:auto;
margin-bottom:60px;
}

.faq-wrapper{
max-width:900px;
margin:auto;
}

.accordion-item{
border:none;
margin-bottom:20px;
border-radius:24px !important;
overflow:hidden;
box-shadow:0 10px 35px rgba(0,0,0,.06);
}

.accordion-button{
font-size:18px;
font-weight:600;
padding:25px;
background:#ffffff;
box-shadow:none !important;
}

.accordion-button:not(.collapsed){
background:#ffc107;
color:#111111;
}

.accordion-body{
padding:25px;
background:#ffffff;
color:#6b7280;
line-height:1.9;
}

/* =========================
        SCROLLBAR
========================= */

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{
background:#ffc107;
border-radius:10px;
}

/* =========================
        TABLET
========================= */

@media(max-width:992px){

h1{
font-size:52px;
}

h2{
font-size:40px;
}

.testimonial-item{
flex:0 0 48%;
}

}

/* =========================
        MOBILE
========================= */

@media(max-width:768px){

section{
padding:70px 0;
}

h1{
font-size:38px;
line-height:1.2;
}

h2{
font-size:30px;
line-height:1.3;
}

h3{
font-size:28px;
}

.container{
padding-left:18px;
padding-right:18px;
}

.brand-image,
.event-image{
height:240px;
}

.brand-content,
.event-content{
padding:22px;
}

.brand-content p,
.event-content p{
min-height:auto;
}

.testimonial-item{
flex:0 0 95%;
}

.review-text{
min-height:auto;
font-size:16px;
}

.testimonial-card{
padding:28px;
}

.customer-info h5{
font-size:18px;
}

.faq-heading{
font-size:34px;
}

.accordion-button{
font-size:16px;
padding:20px;
}

.accordion-body{
padding:20px;
}

.btn{
width:100%;
}

}

</style>

</head>

<body>

<!-- =========================
        NAVBAR
========================= -->

{% include 'components/navbar.html' %}

<!-- =========================
        MAIN CONTENT
========================= -->

<main>

{% block content %}

{% endblock %}

</main>

<!-- =========================
        FOOTER
========================= -->

{% include 'components/footer.html' %}

<!-- =========================
        BOOTSTRAP JS
========================= -->

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

</script>

<!-- =========================
        CUSTOM JS
========================= -->

<script>

/* NAVBAR SCROLL EFFECT */

window.addEventListener(

'scroll',

function(){

const navbar = document.querySelector('.custom-navbar');

if(!navbar) return;

if(window.scrollY > 30){
    navbar.style.background = 'rgba(10,10,10,.96)';
    navbar.style.backdropFilter = 'blur(18px)';
}else{
    navbar.style.background = 'rgba(10,10,10,.92)';
}

}

);

</script>

</body>

</html>
