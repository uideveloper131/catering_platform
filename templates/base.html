<head>

{% load static %}

<!-- =========================
        BASIC META
========================= -->

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<meta
http-equiv="X-UA-Compatible"
content="IE=edge">

<meta
name="robots"
content="index,follow">

<meta
name="theme-color"
content="#0f0f0f">

<meta
name="author"
content="Catering Platform">

<!-- =========================
        DYNAMIC SEO
========================= -->

<title>
{% block title %}
Premium Catering Services | Catering Platform
{% endblock %}
</title>

<meta
name="description"
content="{% block meta_description %}Premium catering services for weddings, birthdays, corporate events, private parties and luxury celebrations.{% endblock %}">

<meta
name="keywords"
content="{% block meta_keywords %}catering services,wedding catering,birthday catering,corporate catering,luxury catering,event catering{% endblock %}">

<link
rel="canonical"
href="{{ request.build_absolute_uri }}">

<!-- =========================
        OPEN GRAPH
========================= -->

<meta
property="og:type"
content="website">

<meta
property="og:site_name"
content="Catering Platform">

<meta
property="og:title"
content="{% block og_title %}Premium Catering Services | Catering Platform{% endblock %}">

<meta
property="og:description"
content="{% block og_description %}Luxury catering services for weddings, corporate events, birthdays and special celebrations.{% endblock %}">

<meta
property="og:url"
content="{{ request.build_absolute_uri }}">

<meta
property="og:image"
content="{% static 'images/seo-banner.jpg' %}">

<!-- =========================
        TWITTER CARD
========================= -->

<meta
name="twitter:card"
content="summary_large_image">

<meta
name="twitter:title"
content="{% block twitter_title %}Premium Catering Services | Catering Platform{% endblock %}">

<meta
name="twitter:description"
content="{% block twitter_description %}Luxury catering services for weddings, birthdays, corporate events and private parties.{% endblock %}">

<meta
name="twitter:image"
content="{% static 'images/seo-banner.jpg' %}">

<!-- =========================
        FAVICON
========================= -->

<link
rel="icon"
type="image/png"
href="{% static 'images/favicon.png' %}">

<!-- =========================
        GOOGLE FONTS
========================= -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet">

<!-- =========================
        BOOTSTRAP
========================= -->

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- =========================
        REMIX ICONS
========================= -->

<link
href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
rel="stylesheet">

<!-- =========================
        STRUCTURED DATA SEO
========================= -->

<script type="application/ld+json">
{
 "@context":"https://schema.org",
 "@type":"LocalBusiness",
 "name":"Catering Platform",
 "url":"https://cateringservices.pythonanywhere.com",
 "description":"Premium catering services for weddings, birthdays, corporate events and luxury celebrations.",
 "image":"https://cateringservices.pythonanywhere.com/static/images/seo-banner.jpg",
 "telephone":"+1-000-000-0000"
}
</script>

<!-- =========================
        YOUR EXISTING CSS
========================= -->

<style>

/* =========================================================
                        ROOT VARIABLES
========================================================= */

:root{

--primary:#f4b400;
--primary-light:#ffd95e;

--dark:#0f0f0f;
--dark-2:#151515;
--dark-3:#1c1c1c;

--white:#ffffff;

--gray-100:#f9fafb;
--gray-200:#f3f4f6;
--gray-300:#e5e7eb;
--gray-400:#d1d5db;
--gray-500:#9ca3af;
--gray-600:#6b7280;
--gray-700:#4b5563;

--gradient-primary:
linear-gradient(
135deg,
#f4b400 0%,
#ffd95e 100%
);

--gradient-dark:
linear-gradient(
135deg,
#0f0f0f 0%,
#1c1c1c 100%
);

--shadow-lg:
0 20px 60px rgba(0,0,0,.08);

--shadow-hover:
0 30px 80px rgba(0,0,0,.12);

--glass:
rgba(255,255,255,.08);

--border:
1px solid rgba(255,255,255,.08);

}

/* =========================================================
                        GLOBAL RESET
========================================================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
overflow-x:hidden;
}

body{

font-family:'Inter',sans-serif;
background:#ffffff;
color:#111111;
overflow-x:hidden;
-webkit-font-smoothing:antialiased;

}

/* =========================================================
                        CUSTOM SELECTION
========================================================= */

::selection{
background:#f4b400;
color:#111111;
}

/* =========================================================
                        SCROLLBAR
========================================================= */

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-track{
background:#f3f4f6;
}

::-webkit-scrollbar-thumb{
background:linear-gradient(
180deg,
#f4b400,
#ffd95e
);
border-radius:20px;
}

/* =========================================================
                        CONTAINER
========================================================= */

.container{
max-width:1380px;
padding-left:24px;
padding-right:24px;
}

/* =========================================================
                        SECTION SPACING
========================================================= */

section{
position:relative;
padding:120px 0;
}

/* =========================================================
                        TYPOGRAPHY
========================================================= */

h1,h2,h3,h4,h5,h6{
margin:0;
color:#111111;
font-weight:800;
letter-spacing:-1px;
}

h1{
font-size:72px;
line-height:1.05;
}

h2{
font-size:54px;
line-height:1.1;
}

h3{
font-size:36px;
}

p{
font-size:16px;
line-height:1.9;
color:var(--gray-600);
}

/* =========================================================
                        SECTION LABEL
========================================================= */

.section-label{

display:inline-flex;
align-items:center;
gap:10px;

padding:10px 18px;

border-radius:50px;

background:rgba(244,180,0,.12);

color:#b58100;

font-size:13px;
font-weight:700;
letter-spacing:1px;
text-transform:uppercase;

margin-bottom:24px;

}

/* =========================================================
                        SECTION TITLE
========================================================= */

.section-title{
margin-bottom:20px;
}

.section-subtitle{
max-width:760px;
margin:auto;
font-size:17px;
}

/* =========================================================
                        BUTTONS
========================================================= */

.btn{

position:relative;
overflow:hidden;

border:none;
border-radius:60px;

padding:16px 34px;

font-size:15px;
font-weight:700;

transition:.35s ease;

z-index:1;

}

.btn-warning{

background:var(--gradient-primary);
color:#111111;

box-shadow:
0 15px 40px rgba(244,180,0,.28);

}

.btn-warning:hover{

transform:translateY(-4px);

box-shadow:
0 25px 60px rgba(244,180,0,.4);

color:#111111;

}

.btn-dark{

background:#111111;
color:#ffffff;

}

.btn-dark:hover{

background:#000000;
transform:translateY(-4px);
color:#ffffff;

}

/* =========================================================
                        PREMIUM CARDS
========================================================= */

.premium-card{

position:relative;

background:#ffffff;

border-radius:32px;

overflow:hidden;

transition:.4s ease;

box-shadow:var(--shadow-lg);

height:100%;

}

.premium-card:hover{

transform:translateY(-10px);

box-shadow:var(--shadow-hover);

}

/* =========================================================
                        IMAGE SYSTEM
========================================================= */

.image-wrapper{
overflow:hidden;
position:relative;
}

.image-wrapper img{

width:100%;
height:100%;
object-fit:cover;

transition:transform .7s ease;

}

.premium-card:hover img{
transform:scale(1.08);
}

/* =========================================================
                        GLASS EFFECT
========================================================= */

.glass-card{

background:rgba(255,255,255,.12);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

border:var(--border);

}

/* =========================================================
                        NAVBAR
========================================================= */

.custom-navbar{

position:fixed;
top:0;
left:0;
width:100%;

z-index:999;

padding:18px 0;

background:rgba(10,10,10,.82);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

border-bottom:
1px solid rgba(255,255,255,.06);

transition:.35s ease;

}

/* =========================================================
                        TEXT GRADIENT
========================================================= */

.text-gradient{

background:linear-gradient(
135deg,
#f4b400,
#ffd95e
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

/* =========================================================
                        PREMIUM BADGE
========================================================= */

.premium-badge{

display:inline-flex;
align-items:center;
gap:10px;

padding:12px 20px;

border-radius:50px;

background:#ffffff;

box-shadow:
0 10px 30px rgba(0,0,0,.06);

font-size:14px;
font-weight:700;

}

/* =========================================================
                        INPUTS
========================================================= */

.form-control{

height:60px;

border-radius:18px;

border:1px solid #e5e7eb;

padding-left:20px;

font-size:15px;

box-shadow:none !important;

}

.form-control:focus{

border-color:#f4b400;

box-shadow:
0 0 0 5px rgba(244,180,0,.12) !important;

}

/* =========================================================
                        FOOTER
========================================================= */

footer{

background:#0f0f0f;
color:#ffffff;

padding-top:120px;

position:relative;

overflow:hidden;

}

footer::before{

content:'';

position:absolute;

width:500px;
height:500px;

background:
radial-gradient(
circle,
rgba(244,180,0,.12),
transparent 70%
);

top:-250px;
right:-200px;

}

/* =========================================================
                        ANIMATIONS
========================================================= */

.fade-up{

animation:fadeUp .8s ease forwards;

opacity:0;

}

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* =========================================================
                        FLOATING EFFECT
========================================================= */

.float-animation{

animation:floating 5s ease-in-out infinite;

}

@keyframes floating{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0px);
}

}

/* =========================================================
                        MOBILE
========================================================= */

@media(max-width:992px){

section{
padding:90px 0;
}

h1{
font-size:52px;
line-height:1.1;
}

h2{
font-size:42px;
}

}

@media(max-width:768px){

.container{
padding-left:18px;
padding-right:18px;
}

section{
padding:80px 0;
}

h1{
font-size:40px;
line-height:1.2;
}

h2{
font-size:32px;
line-height:1.3;
}

h3{
font-size:26px;
}

.btn{
width:100%;
}

.section-subtitle{
font-size:15px;
}

}
</style>

</head>
<body>
<!-- =========================================================
                        NAVBAR
========================================================= -->

{% include 'components/navbar.html' %}

<!-- =========================================================
                        MAIN CONTENT
========================================================= -->

<main>

{% block content %}

{% endblock %}

</main>

<!-- =========================================================
                        FOOTER
========================================================= -->

{% include 'components/footer.html' %}

<!-- =========================================================
                        BOOTSTRAP JS
========================================================= -->

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- =========================================================
                        PREMIUM JAVASCRIPT
========================================================= -->

<script>

/* =========================================================
        PREMIUM NAVBAR EFFECT
========================================================= */

window.addEventListener(

"scroll",

function(){

const navbar =
document.querySelector(".custom-navbar");

if(window.scrollY > 50){

navbar.style.background =
"rgba(10,10,10,.94)";

navbar.style.padding =
"14px 0";

navbar.style.boxShadow =
"0 10px 40px rgba(0,0,0,.18)";

}else{

navbar.style.background =
"rgba(10,10,10,.82)";

navbar.style.padding =
"18px 0";

navbar.style.boxShadow =
"none";

}

}

);

/* =========================================================
        FADE-UP ANIMATION
========================================================= */

const observer = new IntersectionObserver(

(entries)=>{

entries.forEach((entry)=>{

if(entry.isIntersecting){

entry.target.classList.add("show");

}

});

},

{
threshold:0.15
}

);

document.querySelectorAll(".fade-up")
.forEach((el)=>{

observer.observe(el);

});

</script>

</body>
