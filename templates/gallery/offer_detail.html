{% extends 'base.html' %}

{% block content %}

<section class="py-5">

<div class="container">

<div class="row">

<div class="col-md-6">

<img
src="{{offer.image.url}}"
class="img-fluid rounded shadow">

</div>


<div class="col-md-6">

<h1>

{{offer.title}}

</h1>

<h3 class="text-warning">

{{offer.price}}

</h3>

<h5>

{{offer.subtitle}}

</h5>

<hr>

<p>

{{offer.description}}

</p>

<hr>

<h4>

Package Includes

</h4>

<ul class="list-group">

{% for feature in offer.features.all %}

<li class="list-group-item">

✓ {{feature.feature}}

</li>

{% endfor %}

</ul>

<a
href="/request-quote/"
class="btn btn-warning btn-lg">

Request Quote

</a>

</div>

</div>

</div>

</section>

{% endblock %}
