{% extends 'base.html' %}

{% block content %}

<section class="py-5">

<div class="container">

<h1 class="text-center fw-bold mb-5">

Special Offers & Packages

</h1>

<div class="row">

{% for offer in offers %}

<div class="col-md-4 mb-4">

<div class="card shadow border-0 h-100">

<img
src="{{offer.image.url}}"
class="card-img-top"
style="height:250px;object-fit:cover;">

<div class="card-body">

<h4>

{{offer.title}}

</h4>

<h5 class="text-warning">

{{offer.price}}

</h5>

<p>

{{offer.subtitle}}

</p>

<p>

{{offer.description|truncatewords:20}}

</p>

<a
href="{% url 'offer_detail' offer.id %}"
class="btn btn-warning">

View Details

</a>

</div>

</div>

</div>

{% empty %}

<div class="text-center">

<h4>

No offers available

</h4>

</div>

{% endfor %}

</div>

</div>

</section>

{% endblock %}
